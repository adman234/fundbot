<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Fund — Status Sheet</title>
<link rel="icon" type="image/png" href="/static/fundbot.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:    #FBFAF6;
    --grid:     #D2E1E7;
    --ink:      #101A22;
    --graphite: #61727C;
    --rule:     #C4CBCE;
    --cut:      #C8102E;
    --met:      #157F5B;

    /* Always-light, independent of theme: text sitting on a solid accent
       fill (buttons, badges) and the QR card, which stays light so it
       keeps scanning reliably regardless of page theme. */
    --paper-fixed: #FBFAF6;

    --sheet-max: 62rem;
    --step: 1.5rem;
  }

  :root[data-theme="dark"] {
    --paper:    #14191D;
    --grid:     #202B31;
    --ink:      #ECEEF0;
    --graphite: #8FA0AA;
    --rule:     #33404A;
    --cut:      #FF5D72;
    --met:      #2ECC91;
  }

  * { box-sizing: border-box; }

  /* The hidden attribute has to beat the display rules on .give-panel and
     .titleblock, or they render with placeholder values while loading. */
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: clamp(1rem, 4vw, 3rem) clamp(1rem, 4vw, 2rem) 4rem;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: var(--step) var(--step);
    background-position: -1px -1px;
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .sheet {
    max-width: var(--sheet-max);
    margin: 0 auto;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    box-shadow: 0 1px 0 var(--rule), 0 18px 40px -30px rgba(16, 26, 34, .55);
  }

  /* ---------- masthead ---------- */

  .masthead {
    padding: clamp(1.5rem, 4vw, 2.75rem);
    border-bottom: 1.5px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem 2.5rem;
    flex-wrap: wrap;
  }

  .masthead-main {
    flex: 1 1 20rem;
    min-width: 0;
  }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: .6875rem;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--graphite);
    display: flex;
    flex-wrap: wrap;
    gap: .5rem 1.25rem;
    margin-bottom: 1.25rem;
  }
  .eyebrow span::before { content: "⌀ "; color: var(--rule); }
  .eyebrow span:first-child::before { content: none; }

  h1 {
    font-family: "IBM Plex Sans Condensed", sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 3.5rem);
    line-height: .95;
    letter-spacing: .01em;
    text-transform: uppercase;
    margin: 0;
  }
  h1 em {
    font-style: normal;
    display: block;
    color: var(--cut);
  }

  /* ---------- masthead side: QR code beside a stack of small controls ---- */

  .masthead-side {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    gap: .875rem;
  }

  .side-actions {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: .5rem;
    min-width: 8.5rem;
  }

  /* One shared shape for every control in the stack, so they line up. */
  .side-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .4375rem;
    padding: .5rem .75rem;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    text-decoration: none;
    font-family: "IBM Plex Mono", monospace;
    font-size: .6875rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    text-align: center;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .side-btn:hover,
  .side-btn:focus-visible {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0 var(--ink);
  }
  .side-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .theme-toggle-icon { font-size: .875rem; line-height: 1; }

  /* ---------- give panel (QR + donate link) ---------- */

  .give-qr {
    flex: 0 0 auto;
    line-height: 0;
    padding: .375rem;
    background: var(--paper-fixed);
    border: 1.5px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
  }
  .give-qr img {
    display: block;
    width: clamp(86px, 12vw, 168px);
    height: clamp(86px, 12vw, 168px);
  }

  .give {
    background: var(--cut);
    color: var(--paper-fixed);
  }
  .give::after { content: "\2192"; }

  /* Caption that stands in for the donate link on the kiosk. */
  .give-label {
    display: none;
    font-family: "IBM Plex Mono", monospace;
    font-size: .6875rem;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: .1em;
    text-transform: uppercase;
    text-align: center;
    color: var(--graphite);
    margin: 0;
  }

  /* kioskmgr:// only resolves on the terminal, so hide it everywhere else. */
  .open-gui { display: none; }

  /* ---------- kiosk mode (?kiosk): the shop touchscreen ----------
     A donate link there would open the payment page in a tab the kiosk
     cannot leave, so it becomes a caption pointing at the QR code, and the
     terminal gains a button that raises the kiosk-manager window. */

  :root[data-kiosk] .give { display: none; }
  :root[data-kiosk] .give-label { display: block; }
  :root[data-kiosk] .open-gui { display: inline-flex; }
  :root[data-kiosk] .give-qr img {
    width: min(180px, 46vw);
    height: min(180px, 46vw);
  }

  /* ---------- campaign ---------- */

  .campaign {
    padding: clamp(1.5rem, 4vw, 2.75rem);
    border-bottom: 1px solid var(--rule);
  }
  .campaign:last-of-type { border-bottom: 0; }
  .campaign.finished {
    filter: grayscale(1);
    opacity: .55;
  }

  .campaign-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: .5rem 1.5rem;
    margin-bottom: 2.25rem;
  }

  .campaign-name {
    font-family: "IBM Plex Sans Condensed", sans-serif;
    font-weight: 600;
    font-size: clamp(1.375rem, 3.5vw, 1.875rem);
    text-transform: uppercase;
    letter-spacing: .015em;
    margin: 0;
  }

  .tally {
    font-family: "IBM Plex Mono", monospace;
    font-size: .8125rem;
    color: var(--graphite);
    white-space: nowrap;
  }
  .tally b {
    font-weight: 600;
    font-size: 1.0625rem;
    color: var(--ink);
  }

  /* ---------- the gauge: ruler + track + dimension line ---------- */

  .gauge { --pct: 0; }

  .scale {
    position: relative;
    height: 12px;
    border-bottom: 1px solid var(--rule);
  }
  .scale i {
    position: absolute;
    bottom: 0;
    width: 1px;
    height: 4px;
    background: var(--rule);
  }
  .scale i.major { height: 9px; background: var(--graphite); }

  .track {
    position: relative;
    height: 26px;
    border: 1px solid var(--ink);
    border-top: 0;
    background:
      repeating-linear-gradient(
        -45deg,
        transparent 0 5px,
        rgba(97, 114, 124, .12) 5px 6px
      );
  }
  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: calc(var(--pct) * 100%);
    max-width: 100%;
    background: var(--cut);
  }
  .overrun {
    position: absolute;
    top: 50%;
    right: .5rem;
    transform: translateY(-50%);
    font-family: "IBM Plex Mono", monospace;
    font-size: .6875rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--paper-fixed);
  }

  /* ISO-style dimension line beneath the filled span */
  .dim {
    position: relative;
    width: calc(var(--pct) * 100%);
    max-width: 100%;
    min-width: 8.5rem;
    margin-top: .5rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .dim::before,
  .dim::after {
    content: "";
    position: absolute;
    top: -.5rem;
    width: 1px;
    height: .5rem;
    background: var(--graphite);
  }
  .dim::before { left: 0; }
  .dim::after  { right: 0; }

  .dim-line {
    flex: 1 1 auto;
    height: 1px;
    background: var(--graphite);
    position: relative;
  }
  .dim-line::before {
    content: "";
    position: absolute;
    top: -3px;
    border-block: 3.5px solid transparent;
  }
  .dim-line.l::before {
    left: 0;
    border-right: 7px solid var(--graphite);
  }
  .dim-line.r::before {
    right: 0;
    border-left: 7px solid var(--graphite);
  }

  .dim-val {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: .9375rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: var(--ink);
  }

  .remaining {
    font-family: "IBM Plex Mono", monospace;
    font-size: .75rem;
    letter-spacing: .04em;
    color: var(--graphite);
    margin-top: .75rem;
  }
  /* ---------- donors ---------- */

  .ledger {
    margin: 1.75rem 0 0;
    border-top: 1px dashed var(--rule);
    padding-top: 1rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: .8125rem;
  }
  .ledger-label {
    font-size: .625rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--graphite);
    margin-bottom: .625rem;
  }
  .ledger ol { list-style: none; margin: 0; padding: 0; }
  .ledger li {
    display: flex;
    align-items: baseline;
    gap: .5rem;
    padding: .1875rem 0;
  }
  .ledger .lead {
    flex: 1 1 auto;
    border-bottom: 1px dotted var(--rule);
    transform: translateY(-.2em);
  }
  .ledger .amt { font-variant-numeric: tabular-nums; }

  /* ---------- title block ---------- */

  .titleblock {
    border-top: 1.5px solid var(--ink);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    font-family: "IBM Plex Mono", monospace;
  }
  .titleblock div {
    padding: .875rem 1rem;
    border-right: 1px solid var(--rule);
  }
  .titleblock div:last-child { border-right: 0; }
  .titleblock dt {
    font-size: .625rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--graphite);
    margin-bottom: .25rem;
  }
  .titleblock dd {
    margin: 0;
    font-size: .9375rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- states ---------- */

  .notice {
    padding: clamp(1.5rem, 4vw, 2.75rem);
    font-family: "IBM Plex Mono", monospace;
    font-size: .875rem;
    color: var(--graphite);
  }
  .notice b {
    display: block;
    font-family: "IBM Plex Sans Condensed", sans-serif;
    font-size: 1.25rem;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: .375rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
<script>
  // ?kiosk (or ?kiosk=1) marks the shop touchscreen; ?kiosk=0 turns it off.
  // Runs before first paint so the kiosk layout never flashes the web one.
  (function () {
    const v = new URLSearchParams(location.search).get("kiosk");
    if (v !== null && !/^(0|false|no|off)$/i.test(v)) {
      document.documentElement.setAttribute("data-kiosk", "");
    }
  })();
</script>
</head>
<body>

<main class="sheet">
  <header class="masthead">
    <div class="masthead-main">
      <p class="eyebrow">
        <span>Status sheet</span>
        <span>Live from Discord</span>
        <span id="rev">Rev —</span>
      </p>
      <h1>Shop fund<em>Where we stand</em></h1>
    </div>

    <div class="masthead-side">
      <div class="give-qr" id="give-qr" hidden>
        <img id="give-qr-img" src="/qr.svg" alt="Scan to donate" width="168" height="168">
      </div>

      <div class="side-actions">
        <button type="button" id="theme-toggle" class="side-btn" aria-pressed="true">
          <span class="theme-toggle-icon" aria-hidden="true">&#9789;</span>
          <span class="theme-toggle-text">Dark</span>
        </button>

        <a class="side-btn open-gui" id="open-gui" href="kioskmgr://show">Open GUI</a>

        <a class="side-btn give" id="give-link" href="#" target="_blank" rel="noopener"
           hidden>Scan to give</a>
        <p class="give-label" id="give-label" hidden>Scan to give</p>
      </div>
    </div>
  </header>

  <div id="sheet-body">
    <div class="notice"><b>Loading</b>Pulling the latest figures.</div>
  </div>

  <dl class="titleblock" id="titleblock" hidden>
    <div><dt>Campaigns</dt><dd id="tb-count">—</dd></div>
    <div><dt>Total raised</dt><dd id="tb-raised">—</dd></div>
    <div><dt>Donations</dt><dd id="tb-gifts">—</dd></div>
    <div><dt>Updated</dt><dd id="tb-updated">—</dd></div>
  </dl>
</main>

<script>
const body = document.getElementById("sheet-body");
const tb = document.getElementById("titleblock");
const giveQr = document.getElementById("give-qr");
const giveLink = document.getElementById("give-link");
const giveLabel = document.getElementById("give-label");
const giveQrImg = document.getElementById("give-qr-img");
const themeToggle = document.getElementById("theme-toggle");
const themeToggleText = themeToggle.querySelector(".theme-toggle-text");
const themeToggleIcon = themeToggle.querySelector(".theme-toggle-icon");
let rev = 0;

giveQrImg.addEventListener("error", () => { giveQr.hidden = true; });

function setTheme(mode) {
  document.documentElement.setAttribute("data-theme", mode);
  themeToggle.setAttribute("aria-pressed", String(mode === "dark"));
  themeToggleIcon.textContent = mode === "dark" ? "☽" : "☀";
  themeToggleText.textContent = mode === "dark" ? "Dark" : "Light";
}

themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  setTheme(current === "dark" ? "light" : "dark");
});

const money = (cur, n) =>
  cur + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function ticks() {
  let out = "";
  for (let i = 0; i <= 20; i++) {
    const major = i % 5 === 0;
    out += `<i class="${major ? "major" : ""}" style="left:${i * 5}%"></i>`;
  }
  return out;
}

function campaignHTML(c) {
  const met = c.raised >= c.goal;
  const pct = Math.min(c.pct, 1);
  const short = Math.max(0, c.goal - c.raised);

  const ledger = c.recent.length ? `
    <div class="ledger">
      <p class="ledger-label">Most recent</p>
      <ol>${c.recent.map(d => `
        <li><span>${esc(d.donor)}</span><span class="lead"></span>
            <span class="amt">${money(c.currency, d.amount)}</span></li>`).join("")}
      </ol>
    </div>` : "";

  return `
    <section class="campaign ${met ? "finished" : ""}">
      <div class="campaign-head">
        <h2 class="campaign-name">${esc(c.name)}</h2>
        <p class="tally"><b>${money(c.currency, c.raised)}</b> of ${money(c.currency, c.goal)}</p>
      </div>

      <div class="gauge" style="--pct:${pct}">
        <div class="scale">${ticks()}</div>
        <div class="track">
          <div class="fill"></div>
          ${met ? `<span class="overrun">Finished!</span>` : ""}
        </div>
        <div class="dim">
          <span class="dim-line l"></span>
          <span class="dim-val">${(c.pct * 100).toFixed(1)}%</span>
          <span class="dim-line r"></span>
        </div>
      </div>

      <p class="remaining">${met
        ? `Finished! ${money(c.currency, c.raised)} raised across ${c.count} gift${c.count === 1 ? "" : "s"}.`
        : `${money(c.currency, short)} to go · ${c.count} gift${c.count === 1 ? "" : "s"} so far`}</p>

      ${ledger}
    </section>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

async function load() {
  let data;
  try {
    const res = await fetch("/api/campaigns", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    body.innerHTML = `<div class="notice"><b>Can't reach the tracker</b>
      The sheet will retry on its own in 30 seconds.</div>`;
    tb.hidden = true;
    return;
  }

  // The kiosk hides the link and shows the caption instead; both are driven
  // from the same donate URL so neither appears without a QR code to scan.
  if (data.donate_url) {
    giveLink.href = data.donate_url;
  }
  giveLink.hidden = !data.donate_url;
  giveLabel.hidden = !data.donate_url;
  giveQr.hidden = !data.donate_url;

  // Active campaigns first, finished ones sink to the bottom; alphabetical
  // order within each group is preserved since Array#sort is stable and the
  // API already returns rows ordered by name.
  const cs = [...data.campaigns].sort((a, b) => {
    const aMet = a.raised >= a.goal, bMet = b.raised >= b.goal;
    return aMet === bMet ? 0 : aMet ? 1 : -1;
  });

  if (!cs.length) {
    body.innerHTML = `<div class="notice"><b>Nothing running yet</b>
      Start one in Discord with /fund create, then it shows up here.</div>`;
    tb.hidden = true;
    return;
  }

  body.innerHTML = cs.map(campaignHTML).join("");

  document.getElementById("tb-count").textContent = cs.length;
  document.getElementById("tb-raised").textContent =
    money(cs[0].currency, cs.reduce((s, c) => s + c.raised, 0));
  document.getElementById("tb-gifts").textContent =
    cs.reduce((s, c) => s + c.count, 0);
  document.getElementById("tb-updated").textContent =
    new Date(data.generated).toLocaleString(undefined,
      { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  document.getElementById("rev").textContent = "Rev " + String(++rev).padStart(3, "0");
  tb.hidden = false;
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
